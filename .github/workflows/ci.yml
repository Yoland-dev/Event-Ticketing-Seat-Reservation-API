name: CI

# lint ──▶ test (against a throwaway PostgreSQL) ──▶ build image + smoke test ──▶ push (main only)
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: halcyon/ticketing-api

jobs:
  lint:
    name: Lint (black + flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install black==26.10.1 flake8==7.5.0

      - name: black (formatting)
        run: black --check --diff .

      - name: flake8 (style + static errors)
        run: flake8 .

  test:
    name: Test (pytest + coverage on PostgreSQL)
    needs: lint
    runs-on: ubuntu-latest

    # Temporary database: a fresh PostgreSQL container that exists only for this
    # job. pytest-django also creates and drops its own test_ database inside it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: halcyon
          POSTGRES_USER: halcyon
          POSTGRES_PASSWORD: halcyon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U halcyon -d halcyon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://halcyon:halcyon@localhost:5432/halcyon
      DJANGO_SECRET_KEY: ci-only-secret-key-not-used-anywhere-else-0123456789abcdef

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django system checks
        run: python manage.py check

      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Apply migrations to the CI database
        run: python manage.py migrate --noinput

      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file openapi-schema.yml

      - name: Run tests with coverage (fails under 80%)
        run: >-
          pytest
          --cov
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=80
          --junitxml=junit.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            junit.xml
            openapi-schema.yml

  build:
    name: Build Docker image + smoke test
    needs: test
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the stack with docker compose
        env:
          API_IMAGE: ${{ env.IMAGE_NAME }}:ci
        run: docker compose up -d --no-build

      - name: Wait for /health/ to report ok
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health/ > health.json; then
              cat health.json; echo
              grep -q '"status":"ok"' health.json && exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"; exit 1

      - name: Smoke test auth + an authenticated endpoint
        run: |
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/auth/token/ \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"HalcyonAdmin!2026"}' | python3 -c "import json,sys; print(json.load(sys.stdin)['access'])")
          curl -fsS http://localhost:8000/api/events/ -H "Authorization: Bearer $TOKEN" > /dev/null
          curl -fsS http://localhost:8000/api/schema/ > /dev/null
          echo "Smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

      # Publishing is optional: it runs only on main and only when the
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN repository secrets are set.
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/ticketing-api:latest
            ${{ env.DOCKERHUB_USERNAME }}/ticketing-api:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
